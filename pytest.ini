[pytest]
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=85
testpaths =
    tests
    m0023-e3-matrix-lookup/m0023-tests
    m0033-sk1-plugin-interface/m0033-tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast isolated unit tests
    integration: integration tests spanning multiple components
