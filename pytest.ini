[pytest]
# NOTE (governance remediation): previously this only listed 2 of the 34
# module test directories (m0023, m0033) and measured coverage against
# `src` alone -- a directory holding 34 of the repo's 453 tracked .py files.
# testpaths now covers every m00NN-*/m00NN-tests directory plus the
# services/*/tests directories where the bulk of current source actually
# lives; coverage now also measures `services`. See DECISION_LOG.md
# ("pytest.ini / coverage scope") for what was and wasn't changed here --
# in particular, --cov-fail-under was left at its existing value rather than
# guessed at, since this pass could not execute the full suite to verify a
# safe threshold.
addopts = -q --cov=src --cov=services --cov-report=term-missing --cov-fail-under=85
testpaths =
    tests
    services/calendar-ingestor/tests
    services/data-ingestor/tests
    services/execution-engine/tests
    services/indicator-engine/tests
    services/reentry-engine/tests
    services/reentry-matrix-svc/tests
    services/reporter/tests
    services/risk-manager/tests
    services/signal-generator/tests
    services/telemetry-daemon/tests
    services/transport-router/tests
    m0001-f1-config-preferences/m0001-tests
    m0002-f3-clock-scheduler/m0002-tests
    m0003-d2-calendar-source-adapter/m0003-tests
    m0004-d3-calendar-normalizer/m0004-tests
    m0005-f2-event-log/m0005-tests
    m0006-d4-calendar-trigger-builder/m0006-tests
    m0007-d1-market-feed-adapter/m0007-tests
    m0008-c1-bar-builder/m0008-tests
    m0009-c2-indicator-engine/m0009-tests
    m0010-c3-feature-packager/m0010-tests
    m0011-s1-signal-engine/m0011-tests
    m0012-s2-intent-builder/m0012-tests
    m0013-r1-risk-evaluator/m0013-tests
    m0014-r2-order-intent-compiler/m0014-tests
    m0015-o1-order-router/m0015-tests
    m0016-b1-mt4-adapter-transport/m0016-tests
