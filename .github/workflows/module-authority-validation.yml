name: Module authority consolidation gates

on:
  pull_request:
    paths:
      - 'governance/module_consolidation/**'
      - 'm00*/manifest.json'
      - 'EAFIX_auth_docs/01_canonical_registries/**'
      - 'EAFIX_auth_docs/manifests/**'
      - 'context_packets/**'
      - 'tests/governance/**'
      - '.github/workflows/module-authority-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-and-guard-fixtures:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.22,<5' pytest pytest-cov
      - run: python governance/module_consolidation/validate_consolidation.py --mode candidate --structural-only
      - run: python -m pytest -q -o addopts= tests/governance/test_module_authority.py tests/governance/test_scoped_progress.py tests/governance/test_evidence_versions.py tests/test_generator_update.py tests/test_validator_update.py
      - run: python ci/2099900300260118_validate_atomic_module_manifests.py --scope progress
      - run: python governance/module_consolidation/generate_projections.py --candidate-preview --check
  active-authority-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.22,<5'
      # This job is deliberately blocking until P5/P6 are complete. Staging
      # success must never certify the requested final authority state.
      - run: python governance/module_consolidation/validate_consolidation.py --mode active
      - run: python governance/module_consolidation/generate_projections.py --check
