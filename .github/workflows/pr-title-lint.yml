name: pr-title-lint
on: [pull_request]
permissions:
  pull-requests: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: semantic_pr_title
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Allow sentence-style PR titles
        if: steps.semantic_pr_title.outcome == 'failure'
        run: |
          title="$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")"
          word_count="$(printf '%s' "$title" | tr -cs '[:alnum:]' ' ' | awk '{print NF}')"
          if [[ "$title" =~ ^[A-Z] ]] \
            && [[ "$title" =~ [[:space:]]+ ]] \
            && [[ "$title" != *:* ]] \
            && (( word_count >= 2 )); then
            echo "Accepted sentence-style PR title: $title"
            exit 0
          fi
          echo "::error::PR title must follow Conventional Commits (e.g. 'fix: ...') or be a sentence-style title."
          exit 1
