[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eafix-c2-indicator-engine"
version = "1.0.0"
description = "Canonical EAFIX C2 indicator engine"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
]

[tool.setuptools]
package-dir = {"" = "m0009-src"}

[tool.setuptools.packages.find]
where = ["m0009-src"]
